[versions]
# ── Project ────────────────────────────────────────────────────────────────
locolaser           = "2.6.0"

# ── Kotlin ─────────────────────────────────────────────────────────────────
kotlin              = "2.3.10"
kotlinPoet          = "1.14.2"

# ── Google APIs ────────────────────────────────────────────────────────────
googleApiClient     = "2.2.0"
googleAuthClient    = "1.34.1"

# ── Android ────────────────────────────────────────────────────────────────
android-compileSdk  = "30"
android-targetSdk   = "27"
android-minSdk      = "16"

# ── Test ───────────────────────────────────────────────────────────────────
junit               = "4.13.2"

# ── Other libraries ────────────────────────────────────────────────────────
jcommander          = "1.82"
jsonSimple          = "1.1.1"
icu4j               = "73.2"

# ── Gradle plugins ─────────────────────────────────────────────────────────
androidGradlePlugin = "8.13.0"
nmcp                = "1.4.4"
gradlePluginPublish = "1.2.0"


[libraries]
# ── Kotlin ─────────────────────────────────────────────────────────────────
kotlin-stdlib           = { module = "org.jetbrains.kotlin:kotlin-stdlib",        version.ref = "kotlin" }
kotlin-stdlib-jdk8      = { module = "org.jetbrains.kotlin:kotlin-stdlib-jdk8",   version.ref = "kotlin" }
kotlin-gradle-plugin    = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }
kotlinPoet              = { module = "com.squareup:kotlinpoet",                   version.ref = "kotlinPoet" }

# ── Google APIs ────────────────────────────────────────────────────────────
google-api-client           = { module = "com.google.api-client:google-api-client",             version.ref = "googleApiClient" }
google-oauth-client-jetty   = { module = "com.google.oauth-client:google-oauth-client-jetty",   version.ref = "googleAuthClient" }
# Note: version starts with "v" so it cannot use version.ref (must be a semver string)
google-api-services-sheets  = { module = "com.google.apis:google-api-services-sheets",          version = "v4-rev20220927-2.0.0" }

# ── Test ───────────────────────────────────────────────────────────────────
junit                   = { module = "junit:junit",                               version.ref = "junit" }

# ── Other ──────────────────────────────────────────────────────────────────
jcommander              = { module = "com.beust:jcommander",                      version.ref = "jcommander" }
json-simple             = { module = "com.googlecode.json-simple:json-simple",    version.ref = "jsonSimple" }
icu4j                   = { module = "com.ibm.icu:icu4j",                         version.ref = "icu4j" }


[plugins]
kotlin-jvm              = { id = "org.jetbrains.kotlin.jvm",           version.ref = "kotlin" }
kotlin-multiplatform    = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
android-library         = { id = "com.android.library",                version.ref = "androidGradlePlugin" }
nmcp                    = { id = "com.gradleup.nmcp",                  version.ref = "nmcp" }
nmcp-aggregation        = { id = "com.gradleup.nmcp.aggregation",      version.ref = "nmcp" }
gradle-pluginPublish    = { id = "com.gradle.plugin-publish",          version.ref = "gradlePluginPublish" }
